<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FAF8F2; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; font-weight: 900; font-size: 26px; fill: #000; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; font-weight: 700; font-size: 14px; fill: #555; }
      .box { stroke: #000; stroke-width: 3; rx: 8; ry: 8; filter: drop-shadow(4px 4px 0px #000); }
      .box-yellow { fill: #FFE600; }
      .box-cyan { fill: #00F0FF; }
      .box-pink { fill: #FF6584; }
      .box-green { fill: #25F482; }
      .box-white { fill: #FFFFFF; }
      .box-check { fill: #FFF3CD; stroke: #D97706; stroke-width: 2.5; stroke-dasharray: 4; }
      .text-head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; font-weight: 900; font-size: 15px; fill: #000; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; font-weight: 600; font-size: 12px; fill: #222; }
      .text-check { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; font-weight: 800; font-size: 12px; fill: #B45309; }
      .arrow { stroke: #000; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .loop-arrow { stroke: #FF2E63; stroke-width: 2.5; stroke-dasharray: 4; fill: none; marker-end: url(#arrowhead-red); }
      .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; font-weight: 800; font-size: 11px; fill: #fff; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#000" />
    </marker>
    <marker id="arrowhead-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FF2E63" />
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="960" height="540" class="bg" />

  <!-- 頂部標題 -->
  <text x="50" y="48" class="title">LLM Wiki 製作教學簡報流程圖 (Workflow Graph)</text>
  <text x="50" y="74" class="subtitle">先討論、後生成 ｜ 階段檢查機制 ｜ 步步確認避免重工</text>

  <!-- 步驟 1: 匯入與建立 Wiki -->
  <g transform="translate(50, 110)">
    <rect width="180" height="150" class="box box-yellow" />
    <rect x="10" y="10" width="60" height="20" rx="4" fill="#000" />
    <text x="18" y="24" class="badge">步驟 1</text>
    <text x="12" y="52" class="text-head">搜集與建立 Wiki</text>
    <text x="12" y="76" class="text-body">• 找 5 篇權威文獻/數據</text>
    <text x="12" y="96" class="text-body">• 存入 raw/ 原始資料層</text>
    <text x="12" y="116" class="text-body">• 整理成 wiki/ 概念頁面</text>
    <text x="12" y="136" class="text-body">• 建立 index.md 索引</text>
  </g>

  <!-- 箭頭 1 -> 2 -->
  <path d="M 230 185 L 270 185" class="arrow" />

  <!-- 步驟 2: 整理大綱 -->
  <g transform="translate(275, 110)">
    <rect width="180" height="150" class="box box-cyan" />
    <rect x="10" y="10" width="60" height="20" rx="4" fill="#000" />
    <text x="18" y="24" class="badge">步驟 2</text>
    <text x="12" y="52" class="text-head">討論與整理大綱</text>
    <text x="12" y="76" class="text-body">• 鎖定大學生常見痛點</text>
    <text x="12" y="96" class="text-body">• 規劃 9 頁章節順序</text>
    <text x="12" y="116" class="text-body">• 建立 outline.md 大綱</text>
    <text x="12" y="136" class="text-body">• 確認核心概念不跳躍</text>
  </g>

  <!-- 箭頭 2 -> 檢查點 A -->
  <path d="M 455 185 L 495 185" class="arrow" />

  <!-- 步驟 3: 逐頁規格化 -->
  <g transform="translate(500, 110)">
    <rect width="180" height="150" class="box box-pink" />
    <rect x="10" y="10" width="60" height="20" rx="4" fill="#000" />
    <text x="18" y="24" class="badge">步驟 3</text>
    <text x="12" y="52" class="text-head">逐頁視覺規格化</text>
    <text x="12" y="76" class="text-body">• 卡片化排版，條列字數</text>
    <text x="12" y="96" class="text-body">• 鎖定 5 張圖片相對路徑</text>
    <text x="12" y="116" class="text-body">• 設計 Neo-Brutalism 配色</text>
    <text x="12" y="136" class="text-body">• slides-spec.md 規格書</text>
  </g>

  <!-- 箭頭 3 -> 4 -->
  <path d="M 680 185 L 720 185" class="arrow" />

  <!-- 步驟 4: 生成 HTML 簡報 -->
  <g transform="translate(725, 110)">
    <rect width="185" height="150" class="box box-green" />
    <rect x="10" y="10" width="60" height="20" rx="4" fill="#000" />
    <text x="18" y="24" class="badge">步驟 4</text>
    <text x="12" y="52" class="text-head">生成 HTML 簡報</text>
    <text x="12" y="76" class="text-body">• 產出 index.html 檔案</text>
    <text x="12" y="96" class="text-body">• 16:9 全螢幕美式潮流風</text>
    <text x="12" y="116" class="text-body">• 支援鍵盤左右鍵換頁</text>
    <text x="12" y="136" class="text-body">• 載入本地圖片與圖解</text>
  </g>

  <!-- 下方檢查與重複循環區 (Quality Gates) -->
  <g transform="translate(50, 310)">
    <rect width="405" height="180" rx="10" ry="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5" />
    <text x="20" y="32" class="text-head" fill="#B45309">🔍 檢查點一：大綱確認 (Checkpoint 1)</text>
    <text x="20" y="60" class="text-body">• 是否太艱深？有沒有充斥看不懂的醫學專有名詞？</text>
    <text x="20" y="82" class="text-body">• 有沒有符合大學生生活？（學餐、超商、體育館、考試週）</text>
    <text x="20" y="104" class="text-body">• 邏輯順序對不對？（先推拉熱身 ➔ 再談課表）</text>
    <rect x="20" y="125" width="365" height="38" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5" />
    <text x="30" y="148" class="text-check" fill="#B91C1C">⚠️ 若未通過：退回步驟 2 重新調整大綱，直到確認才繼續！</text>
  </g>

  <g transform="translate(505, 310)">
    <rect width="405" height="180" rx="10" ry="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5" />
    <text x="20" y="32" class="text-head" fill="#B45309">🔍 檢查點二：規格與路徑確認 (Checkpoint 2)</text>
    <text x="20" y="60" class="text-body">• 圖片路徑是否精確（./...）？會不會打開破圖？</text>
    <text x="20" y="82" class="text-body">• 字數會不會太多太密？有沒有拆成卡片與貼紙？</text>
    <text x="20" y="104" class="text-body">• 瀏覽器實際打開 index.html 測試按鍵與排版</text>
    <rect x="20" y="125" width="365" height="38" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5" />
    <text x="30" y="148" class="text-check" fill="#B91C1C">⚠️ 若未通過：退回步驟 3 修正規格，絕不盲目寫代碼！</text>
  </g>

  <!-- 循環迴路虛線 -->
  <path d="M 365 310 L 365 265" class="loop-arrow" />
  <path d="M 725 310 L 725 265" class="loop-arrow" />

</svg>